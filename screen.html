<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>함께 밝히는 한 장</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="screen-page">
  <main class="screen-shell screen-shell--split">
    <header class="screen-header">
      <div>
        <div class="eyebrow">SAVE THE CHILDREN WORKSHOP</div>
        <h1>우리의 참여가 <strong>한 장의 메시지</strong>를 완성합니다</h1>
      </div>
      <div class="screen-actions">
        <div class="counter"><span id="screenCount">0</span><small>/ 200</small></div>
        <button id="resetBtn" class="reset-button" type="button">초기화</button>
      </div>
    </header>

    <section class="split-stage">
      <section class="pledge-panel" aria-label="참여자 다짐 목록">
        <div class="panel-head">
          <p class="eyebrow">LIVE PLEDGES</p>
          <h2>아이들의 내일을 위한<br>우리의 한마디</h2>
          <p>최신 다짐부터 보여집니다. 새로운 메시지가 올라오면 오래된 다짐은 자연스럽게 밀려납니다.</p>
        </div>
        <div id="pledgeWall" class="pledge-wall"></div>
      </section>

      <section class="image-panel" aria-label="참여할수록 밝아지는 워크숍 이미지">
        <div class="image-panel-copy">
          <p class="eyebrow">200개의 참여로 밝히는 사진</p>
          <h2>한 번의 참여가<br>사진 한 조각을 밝힙니다.</h2>
          <p>참여가 쌓일수록 숨겨진 이미지가 조금씩 선명해집니다.</p>
        </div>

        <div class="photo-frame">
          <img class="reveal-photo" src="assets/final.webp" alt="아동의 삶을 바꾸는 것은 여러분입니다" />
          <div id="tileGrid" class="tile-grid" aria-hidden="true"></div>
          <div class="photo-vignette"></div>
        </div>

        <div id="completeBadge" class="complete-badge hidden">
          <span>200 / 200</span>
          <strong>우리의 한 장이 완성되었습니다.</strong>
        </div>
      </section>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="screen.js"></script>
</body>
</html>
