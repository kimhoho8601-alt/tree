<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>함께 밝히는 한 장</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="screen-page">
  <main class="screen-shell">
    <header class="screen-header">
      <div>
        <div class="eyebrow">SAVE THE CHILDREN WORKSHOP</div>
        <h1>우리의 참여가 <strong>한 장의 메시지</strong>를 완성합니다</h1>
      </div>
      <div class="screen-actions">
        <div class="counter"><span id="screenCount">0</span><small>/ 200</small></div>
        <button id="resetBtn" class="reset-button" type="button">초기화</button>
      </div>
    </header>

    <section class="reveal-stage">
      <div class="reveal-copy">
        <p class="eyebrow">200개의 참여로 밝히는 사진</p>
        <h2>한 번의 참여가<br>사진 한 조각을 밝힙니다.</h2>
        <p>같은 사람도 여러 번 참여할 수 있습니다. 참여가 쌓일수록 숨겨진 이미지가 조금씩 선명해집니다.</p>
      </div>

      <div class="photo-frame" aria-label="참여할수록 밝아지는 워크숍 이미지">
        <img class="reveal-photo" src="assets/final.webp" alt="아동의 삶을 바꾸는 것은 여러분입니다" />
        <div id="tileGrid" class="tile-grid" aria-hidden="true"></div>
        <div class="photo-vignette"></div>
      </div>

      <aside class="latest-card photo-latest">
        <span>가장 최근의 다짐</span>
        <blockquote id="latestMessage">첫 번째 참여를 기다리고 있어요.</blockquote>
        <b id="latestName">-</b>
      </aside>

      <div id="completeBadge" class="complete-badge hidden">
        <span>200 / 200</span>
        <strong>우리의 한 장이 완성되었습니다.</strong>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="screen.js"></script>
</body>
</html>
